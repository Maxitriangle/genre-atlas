name: Listen IDs
# Reads each key artist's Deezer, Spotify and YouTube identifiers from Wikidata
# with data/listen-ids.py and commits data/artist-streaming.csv. Runs here
# because Wikidata blocks the address Claude sessions leave from.
on:
  push:
    branches-ignore: [main]
    paths:
      - data/listen-ids.py
      - .github/workflows/listen-ids.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: listen-ids-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ids:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read the identifiers
        run: python3 data/listen-ids.py
      - name: Commit them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/artist-streaming.csv
          git diff --cached --quiet && exit 0
          git commit -m "Streaming identifiers of the key artists"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
