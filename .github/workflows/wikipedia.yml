name: Wikipedia leads
# Fetches the lead of each genre's English Wikipedia article with
# data/wikipedia-fetch.py and commits data/genre-descriptions.csv. Runs here
# because Wikidata limits the address Claude sessions leave from.
on:
  push:
    branches-ignore: [main]
    paths:
      - data/wikipedia-fetch.py
      - .github/workflows/wikipedia.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wikipedia-${{ github.ref }}
  cancel-in-progress: false
jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the leads
        run: python3 data/wikipedia-fetch.py
      - name: Commit the descriptions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/genre-descriptions.csv
          git diff --cached --quiet && exit 0
          git commit -m "Wikipedia leads for the genre dossiers"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
